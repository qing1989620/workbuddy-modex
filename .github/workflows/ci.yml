name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    name: lint & unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv
      - name: Sync deps (incl. dev extras so pytest/ruff are available)
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check . || true
      - name: Pytest (unit + hallucination + portability + e2e)
        run: uv run pytest -q
        env:
          PYTEST_ADDOPTS: ""
      - name: Benchmark suite (negative cases + smoke A/B)
        run: uv run ommw benchmark

  # Full integration: tiny modeling example + LaTeX/DOCX smoke (nightly/release/main)
  integration:
    name: integration smoke
    needs: lint-test
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install uv
      - run: uv sync --extra dev
      - name: Install TeX Live (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-xetex texlive-fonts-recommended latexmk
      - name: Install Pandoc
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y pandoc; fi
        shell: bash
      - name: Fresh-machine simulation
        shell: bash
        run: |
          uv run ommw doctor || true
          uv run ommw smoke-test --dest /tmp/ommw_smoke --mode dual || uv run ommw smoke-test --dest $TEMP/ommw_smoke --mode dual
      - name: README install command check (Rule 154)
        shell: bash
        run: |
          set +e +o pipefail
          uv run ommw --help > /tmp/ommw_help.txt
          head -5 /tmp/ommw_help.txt
          grep -q "Open Mathematical Modeling Workflow" /tmp/ommw_help.txt

  secret-scan:
    name: secret & abs-path scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for leaked tokens
        run: |
          set -e
          ! grep -rE "(sk-[A-Za-z0-9]{20,}|sk-ant-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{30,}|ghp_[A-Za-z0-9]{30,})" \
            --exclude-dir=.git --exclude=.gitignore \
            --exclude-dir=local . || (echo "secret leak detected" && exit 1)
      - name: Scan for machine absolute paths in core
        run: |
          python - <<'PY'
          import re, sys
          from pathlib import Path
          RE = re.compile(
              r"(?:[A-Za-z]:\\(?:Users|Program Files|Windows|ProgramData)\\)"
              r"|(?:/(?:Users|home)/[A-Za-z0-9._-]+/)"
          )
          CORE_DIRS = ("src","skills","templates","providers","schemas","adapters","renderers")
          root = Path(".")
          offenders = []
          for d in CORE_DIRS:
              base = root / d
              for p in base.rglob("*"):
                  if p.is_file() and p.suffix in (".py",".toml",".yaml",".yml",".tex",".md"):
                      # templates/local/ = THIRD-PARTY template copies; their
                      # embedded machine paths are import data audited by the
                      # template pipeline (known_issues), not core source.
                      if d == "templates" and "local" in p.relative_to(base).parts[:1]:
                          continue
                      try: text = p.read_text(encoding="utf-8")
                      except Exception: continue
                      for line in text.splitlines():
                          if line.strip().startswith("#"): continue
                          if RE.search(line):
                              offenders.append(f"{p.relative_to(root)}: {line.strip()[:120]}")
          if offenders:
              print("non-portable absolute paths leaked into core:")
              print("\n".join(offenders[:20])); sys.exit(1)
          print("abs-path scan OK")
          PY
