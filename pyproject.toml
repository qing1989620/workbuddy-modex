[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ommw"
version = "1.0.0-rc2"
description = "Open Mathematical Modeling Workflow: a portable, local-first, anti-hallucination workflow for competition mathematical modeling with LaTeX + Word dual output."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "OMMW Contributors" }]
keywords = ["mathematical-modeling", "latex", "word", "reproducible-research", "agent-skills"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "typer>=0.12.3",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.7",
  "python-docx>=1.1",
  "requests>=2.31",
]

[project.optional-dependencies]
plot = [
  "matplotlib>=3.8",
  "numpy>=1.26",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "ommw[plot]",
]

[project.scripts]
ommw = "ommw.cli:app"

[project.urls]
Homepage = "https://github.com/OMMW/ommw"
Documentation = "https://github.com/OMMW/ommw/tree/main/docs"
Issues = "https://github.com/OMMW/ommw/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ommw"]

[tool.hatch.build.targets.sdist]
include = ["src/ommw", "skills", "templates", "schemas", "providers", "adapters", "renderers", "LICENSE", "NOTICE", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["src"]

[tool.uv]
managed = true
